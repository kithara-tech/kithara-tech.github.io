# Publica o site no GitHub Pages (branch gh-pages).
#  - push na main        -> https://kithara-tech.github.io/ (repo kithara-tech/kithara-tech.github.io)
#                           antes da mudança para a org: https://<usuario>.github.io/<repo>/
#  - pull request aberto -> https://<usuario>.github.io/<repo>/pr-preview/pr-<N>/
#    (o link é comentado automaticamente no PR e o preview é apagado quando o PR fecha)
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, closed]
  workflow_dispatch:

permissions:
  contents: write        # escrever na branch gh-pages
  pull-requests: write   # comentar o link do preview no PR

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Site estático, sem build: só separa o que é publicado.
      # Rotas: /, /portfolio/, /apresentacao/, /materiais/recorrencias/, /materiais/metodo-de-estudo/
      # _fontes/ (protótipos), README e LICENSE NÃO são publicados.
      - name: Montar pasta do site
        if: github.event.action != 'closed'
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r portfolio apresentacao materiais assets _site/
          # Cache-busting: o GitHub Pages deixa CSS/JS em cache por 10 min no navegador.
          # Acrescenta ?v=<commit> aos arquivos de todas as páginas para cada deploy forçar a versão nova.
          V="${GITHUB_SHA::7}"
          find _site -name '*.html' -print0 | xargs -0 sed -i -E "s#(assets/[^\"?]+\.(css|js))\"#\1?v=${V}\"#g"
          # Confere: toda página precisa ter o ?v= aplicado.
          for f in $(find _site -name '*.html'); do
            grep -q "kithara.css?v=${V}" "$f" || { echo "sem cache-busting: $f"; exit 1; }
          done
          find _site -name '*.html' | sort

      # .nojekyll só na raiz da gh-pages. Dentro de pr-preview/pr-N ele não faz falta e,
      # por ser arquivo oculto, sobrava na pasta depois que o preview era removido.
      - name: Desligar Jekyll (produção)
        if: github.event_name != 'pull_request'
        run: touch _site/.nojekyll

      - name: Deploy produção (main)
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: _site
          clean-exclude: pr-preview/

      - name: Deploy preview do PR
        if: github.event_name == 'pull_request'
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: _site
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: auto
